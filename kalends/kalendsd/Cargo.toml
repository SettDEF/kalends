[package]
name = "kalends"
version = "0.1.0"
edition = "2021"
description = "Calendar for the ii desktop — CLI, daemon and JSON backend for the QML app"

[dependencies]
icalcore = { path = "../../icalcore" }
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
chrono-tz = "0.10.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
